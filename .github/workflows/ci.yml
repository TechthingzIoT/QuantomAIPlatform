name: QAIR Continuous Integration

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Project
        run: |
          pip install -e .

      - name: Install Development Dependencies
        run: |
          pip install pytest
          pip install black
          pip install ruff

      - name: Run Ruff
        run: |
          ruff check .

      - name: Run Black
        run: |
          black --check .

      - name: Run Tests
        run: |
          pytest