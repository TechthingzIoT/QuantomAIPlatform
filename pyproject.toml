[project]
name = "qair"
version = "0.1.0"
description = "Quantom AI Runtime"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "llama-cpp-python",
    "typer",
    "rich",
    "pydantic",
    "pyyaml",
    "python-dotenv"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "pre-commit"
]

[project.scripts]
qair = "runtime.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["runtime*"]

[tool.setuptools.package-data]
runtime = [
    "prompts/*.txt",
    "config/*.yaml"
]