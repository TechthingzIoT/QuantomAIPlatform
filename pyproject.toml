[project]
name = "qair"
version = "0.1.0"
description = "Quantom AI Runtime"
requires-python = ">=3.11"

dependencies = [
    "llama-cpp-python",
    "typer",
    "rich",
    "pydantic",
    "pyyaml",
    "python-dotenv"
]

[project.scripts]
quantom-ai = "runtime.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
