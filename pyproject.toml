[project]
name = "qair"
version = "0.6.0"
description = "Quantom AI Runtime"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "llama-cpp-python",
    "typer",
    "rich",
    "pydantic",
    "pyyaml",
    "python-dotenv",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "pre-commit",
]

[project.scripts]
qair = "runtime.cli:run"

[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "runtime*",
]

[tool.setuptools.package-data]
runtime = [
    "prompts/*.txt",
    "config/*.yaml",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
]

norecursedirs = [
    "third_party",
    ".git",
    ".venv",
    "__pycache__",
]